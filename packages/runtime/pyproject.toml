[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "sport-rental-runtime"
version = "0.2.0"
requires-python = ">=3.13"
dependencies = ["SQLAlchemy>=2.0.40,<2.1", "psycopg[binary]>=3.2,<4", "redis>=5,<8", "pika>=1.3,<2", "grpcio>=1.78,<2", "protobuf>=6.33,<8", "PyJWT[crypto]>=2.10,<3", "argon2-cffi>=23,<26", "fastapi==0.141.1"]
[tool.setuptools.packages.find]
where = ["src"]
