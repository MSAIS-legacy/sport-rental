[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "sport-rental-runtime"
version = "0.2.0"
requires-python = ">=3.13"
dependencies = ["SQLAlchemy==2.0.54", "psycopg[binary]==3.3.6", "redis==8.1.0", "pika==1.4.4", "grpcio==1.84.0", "protobuf==7.36.2", "PyJWT[crypto]==2.15.0", "argon2-cffi==25.1.0", "fastapi==0.141.1"]
[tool.setuptools.packages.find]
where = ["src"]
