      context: .
      dockerfile: services/rental/Dockerfile
    ports: ["127.0.0.1:8003:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://rental:${POSTGRES_PASSWORD}@postgres:5432/rental
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://rental:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
  customers:
