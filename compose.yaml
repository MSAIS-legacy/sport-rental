name: sport-rental
services:
  postgres:
    image: sport-rental-postgres:local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure.py first}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 3s
      timeout: 3s
      retries: 30
    build:
      context: infrastructure/postgres
  redis:
    image: redis:7-alpine
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 3s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: rental
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run scripts/configure.py first}
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    ports:
    - 127.0.0.1:15672:15672
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 5s
      timeout: 5s
      retries: 30
  catalog:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    ports:
    - 127.0.0.1:8001:8000
    environment:
      DATABASE_URL: postgresql+psycopg://catalog:${POSTGRES_PASSWORD}@postgres:5432/catalog
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://rental:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck: &id001
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 5s
      timeout: 3s
      retries: 30
    secrets:
    - jwt_public
    image: sport-rental-catalog:local
  inventory:
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    ports:
    - 127.0.0.1:8002:8000
    environment:
      DATABASE_URL: postgresql+psycopg://inventory:${POSTGRES_PASSWORD}@postgres:5432/inventory
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://rental:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 5s
      timeout: 3s
      retries: 30
    secrets:
    - jwt_public
    image: sport-rental-inventory:local
  rental:
    build:
      context: .
      dockerfile: services/rental/Dockerfile
    ports:
    - 127.0.0.1:8003:8000
    environment:
      DATABASE_URL: postgresql+psycopg://rental:${POSTGRES_PASSWORD}@postgres:5432/rental
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://rental:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public
      CUSTOMERS_GRPC_ADDRESS: customers-grpc:50051
      INTERNAL_RPC_TOKEN: ${INTERNAL_RPC_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 5s
      timeout: 3s
      retries: 30
    secrets:
    - jwt_public
    image: sport-rental-rental:local
  customers:
    build:
      context: .
      dockerfile: services/customers/Dockerfile
    ports:
    - 127.0.0.1:8004:8000
    environment:
      DATABASE_URL: postgresql+psycopg://customers:${POSTGRES_PASSWORD}@postgres:5432/customers
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://rental:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 5s
      timeout: 3s
      retries: 30
    secrets:
    - jwt_public
    image: sport-rental-customers:local
  billing:
    build:
      context: .
      dockerfile: services/billing/Dockerfile
    ports:
    - 127.0.0.1:8005:8000
    environment:
      DATABASE_URL: postgresql+psycopg://billing:${POSTGRES_PASSWORD}@postgres:5432/billing
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://rental:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 5s
      timeout: 3s
      retries: 30
    secrets:
    - jwt_public
    image: sport-rental-billing:local
  maintenance:
    build:
      context: .
      dockerfile: services/maintenance/Dockerfile
    ports:
    - 127.0.0.1:8006:8000
    environment:
      DATABASE_URL: postgresql+psycopg://maintenance:${POSTGRES_PASSWORD}@postgres:5432/maintenance
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://rental:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 5s
      timeout: 3s
      retries: 30
    secrets:
    - jwt_public
    image: sport-rental-maintenance:local
  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    ports:
    - 127.0.0.1:8007:8000
    environment:
      DATABASE_URL: postgresql+psycopg://auth:${POSTGRES_PASSWORD}@postgres:5432/auth
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run scripts/configure.py}
    secrets:
    - jwt_private
    - jwt_public
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *id001
    image: sport-rental-auth:local
  customers-grpc:
    command:
    - python
    - -m
    - customers_service.grpc_server
    environment:
      DATABASE_URL: postgresql+psycopg://customers:${POSTGRES_PASSWORD}@postgres:5432/customers
      INTERNAL_RPC_TOKEN: ${INTERNAL_RPC_TOKEN:?Run scripts/configure.py}
    depends_on:
      postgres:
        condition: service_healthy
      customers:
        condition: service_healthy
    image: sport-rental-customers:local
  rental-worker:
    command:
    - python
    - -m
    - rental_service.worker
    environment:
      DATABASE_URL: postgresql+psycopg://rental:${POSTGRES_PASSWORD}@postgres:5432/rental
      RABBITMQ_URL: amqp://rental:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rental:
        condition: service_healthy
    restart: unless-stopped
    image: sport-rental-rental:local
  inventory-worker:
    command:
    - python
    - -m
    - inventory_service.worker
    environment:
      DATABASE_URL: postgresql+psycopg://inventory:${POSTGRES_PASSWORD}@postgres:5432/inventory
      RABBITMQ_URL: amqp://rental:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      inventory:
        condition: service_healthy
    restart: unless-stopped
    image: sport-rental-inventory:local
  billing-worker:
    command:
    - python
    - -m
    - billing_service.worker
    environment:
      DATABASE_URL: postgresql+psycopg://billing:${POSTGRES_PASSWORD}@postgres:5432/billing
      RABBITMQ_URL: amqp://rental:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      billing:
        condition: service_healthy
    restart: unless-stopped
    image: sport-rental-billing:local
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    profiles:
    - test
    environment:
      RUN_INTEGRATION: '1'
      SERVICE_URL_TEMPLATE: http://{service}:8000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://rental:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    volumes:
    - ./test-results:/app/test-results
    depends_on:
      catalog:
        condition: service_healthy
      inventory:
        condition: service_healthy
      rental:
        condition: service_healthy
      customers:
        condition: service_healthy
      billing:
        condition: service_healthy
      maintenance:
        condition: service_healthy
      auth:
        condition: service_healthy
      rental-worker:
        condition: service_started
      inventory-worker:
        condition: service_started
      billing-worker:
        condition: service_started
      customers-grpc:
        condition: service_started
volumes:
  postgres_data: null
  redis_data: null
  rabbitmq_data: null
secrets:
  jwt_private:
    file: .secrets/private.pem
  jwt_public:
    file: .secrets/public.pem
