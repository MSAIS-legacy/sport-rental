name: sport-rental
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure.py first}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./infrastructure/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 3s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: rental
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run scripts/configure.py first}
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    ports:
    - 127.0.0.1:15672:15672
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 5s
      timeout: 5s
      retries: 30
  catalog:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    ports:
    - 127.0.0.1:8001:8000
    environment:
      DATABASE_URL: postgresql+psycopg://catalog:${POSTGRES_PASSWORD}@postgres:5432/catalog
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://rental:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck: &id001
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 5s
      timeout: 3s
      retries: 30
    secrets:
    - jwt_public
  inventory:
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    ports:
    - 127.0.0.1:8002:8000
    environment:
      DATABASE_URL: postgresql+psycopg://inventory:${POSTGRES_PASSWORD}@postgres:5432/inventory
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://rental:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 5s
      timeout: 3s
      retries: 30
    secrets:
    - jwt_public
  rental:
    build:
      context: .
      dockerfile: services/rental/Dockerfile
    ports:
    - 127.0.0.1:8003:8000
    environment:
      DATABASE_URL: postgresql+psycopg://rental:${POSTGRES_PASSWORD}@postgres:5432/rental
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://rental:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 5s
      timeout: 3s
      retries: 30
    secrets:
    - jwt_public
  customers:
    build:
      context: .
      dockerfile: services/customers/Dockerfile
    ports:
    - 127.0.0.1:8004:8000
    environment:
      DATABASE_URL: postgresql+psycopg://customers:${POSTGRES_PASSWORD}@postgres:5432/customers
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://rental:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 5s
      timeout: 3s
      retries: 30
    secrets:
    - jwt_public
  billing:
    build:
      context: .
