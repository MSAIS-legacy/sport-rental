      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://rental:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 5s
      timeout: 3s
      retries: 30
    secrets:
    - jwt_public
  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    ports:
    - 127.0.0.1:8007:8000
    environment:
      DATABASE_URL: postgresql+psycopg://auth:${POSTGRES_PASSWORD}@postgres:5432/auth
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run scripts/configure.py}
    secrets:
    - jwt_private
    - jwt_public
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *id001
volumes:
  postgres_data: null
  redis_data: null
  rabbitmq_data: null
secrets:
  jwt_private:
    file: .secrets/private.pem
  jwt_public:
    file: .secrets/public.pem
